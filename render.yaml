services:
  - type: web
    name: is-light-api
    runtime: node
    plan: free
    buildCommand: npx -y pnpm@12.18.0 install --prod=false --frozen-lockfile --filter . --filter @is-light/server... && npx -y pnpm@12.18.0 build:server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: LOE_API_BASE_URL
        value: https://api.loe.lviv.ua/api
      - key: LOE_POWER_API_BASE_URL
        value: https://power-api.loe.lviv.ua/api
      - key: LOE_LVIV_CITY_ID
        value: "693"
      - key: CORS_ORIGIN
        value: "*"
